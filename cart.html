<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>سلة المشتريات - B11 JUICE</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <!-- LOGO -->

    <a
        href="index.html"
        class="logo"
    >

        <img
            src="b11-logo.png"
            alt="B11 Juice"
        >

    </a>


    <!-- NAVIGATION -->

    <nav class="nav">

        <a href="index.html">
            الرئيسية
        </a>


        <a href="products.html">
            المنتجات
        </a>


        <a
            href="cart.html"
            class="active"
        >

            🛒 السلة

            <span id="cart-count">
                0
            </span>

        </a>


        <a href="favorites.html">

            ❤️ المفضلة

            <span id="favorite-count">
                0
            </span>

        </a>


        <a href="contact.html">
            تواصل معنا
        </a>


        <div id="user-area"></div>


        <a href="account.html">
            👤 حسابي
        </a>

    </nav>

</header>



<!-- =====================================================
     CART PAGE
===================================================== -->

<main class="cart-page">


    <!-- CART TITLE -->

    <div class="cart-title">

        <span class="cart-icon">
            🧃
        </span>


        <h1>
            سلة المشتريات
        </h1>


        <p>
            راجع منتجاتك قبل إتمام الطلب
        </p>

    </div>



    <!-- =================================================
         CART ITEMS
    ================================================= -->

    <div class="cart-wrapper">

        <div id="cart-items">

            <!--
                JavaScript
                هيعرض المنتجات هنا
            -->

        </div>

    </div>



    <!-- =================================================
         CART ACTIONS
    ================================================= -->

    <div class="cart-actions">


        <!-- CONTINUE SHOPPING -->

        <a
            href="products.html"
            class="continue-shopping"
        >

            ← متابعة التسوق

        </a>



        <!-- CHECKOUT -->

        <a
            href="checkout.html"
            class="checkout-link"
        >

            <button
                type="button"
                class="checkout"
            >

                إتمام الطلب 🛒

            </button>

        </a>


    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>


    <!-- FOOTER LOGO -->

    <div class="footer-logo">

        <img
            src="b11-logo.png"
            alt="B11 Juice"
        >

    </div>



    <!-- FOOTER DESCRIPTION -->

    <p>
        Fresh • Natural • Premium 🧃
    </p>



    <!-- FOOTER LINKS -->

    <div class="footer-links">

        <a href="index.html">
            الرئيسية
        </a>


        <a href="products.html">
            المنتجات
        </a>


        <a href="cart.html">
            السلة
        </a>


        <a href="favorites.html">
            المفضلة
        </a>


        <a href="contact.html">
            تواصل معنا
        </a>


        <a href="account.html">
            حسابي
        </a>

    </div>



    <!-- COPYRIGHT -->

    <div class="copyright">

        © 2026 B11 JUICE
        - Fresh • Natural • Premium

    </div>

</footer>



<!-- =====================================================
     SCRIPT
===================================================== -->

<script src="script.js"></script>


</body>

</html>
