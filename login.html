<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول - B11 JUICE</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <a
        href="index.html"
        class="logo"
    >

        <img
            src="b11-logo.png"
            alt="B11 JUICE"
        >

    </a>

</header>



<!-- =========================
     LOGIN
========================= -->

<main class="checkout-page">


    <div class="checkout-title">

        <div class="checkout-icon">
            👤
        </div>


        <h1>
            تسجيل الدخول
        </h1>


        <p>
            أهلاً بيك في B11 JUICE 🧃
        </p>

    </div>



    <div class="checkout-box">


        <!-- PHONE -->

        <div class="input-group">

            <label for="user-phone">
                📱 رقم الهاتف
            </label>

            <input
                type="text"
                id="user-phone"
                placeholder="اكتب رقم الهاتف"
                autocomplete="tel"
            >

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

            <label for="user-password">
                🔐 كلمة المرور
            </label>

            <input
                type="password"
                id="user-password"
                placeholder="اكتب كلمة المرور"
                autocomplete="current-password"
            >

        </div>



        <!-- LOGIN BUTTON -->

        <button
            class="checkout-submit"
            type="button"
            onclick="userLogin()"
        >

            🔐 تسجيل الدخول

        </button>



        <!-- ERROR -->

        <p
            id="user-login-error"
            class="login-error"
        ></p>



        <!-- REGISTER -->

        <div class="login-register">

            <p>
                مش عندك حساب؟
            </p>


            <a href="register.html">

                إنشاء حساب جديد 📝

            </a>

        </div>



        <!-- BACK -->

        <a
            href="index.html"
            class="back-to-cart"
        >

            ← العودة للرئيسية

        </a>

    </div>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="copyright">

        © 2026 B11 JUICE
        - Fresh • Natural • Premium

    </div>

</footer>



<!-- =========================
     SCRIPT
========================= -->

<script src="script.js"></script>


</body>

</html>
